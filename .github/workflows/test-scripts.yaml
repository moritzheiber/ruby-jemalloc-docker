name: Test scripts

on:
  pull_request:
    paths:
      - ".github/scripts/**"
  push:
    paths:
      - ".github/scripts/**"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run script tests
        working-directory: .github/scripts
        run: node --test
