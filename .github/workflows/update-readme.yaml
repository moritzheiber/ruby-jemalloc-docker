name: Update README

on:
  workflow_run:
    workflows: ["Build-Test-Push"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gather-versions:
    uses: ./.github/workflows/container-versions.yaml

  update-readme:
    needs: gather-versions
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate README from template
        uses: actions/github-script@v9
        with:
          script: |
            const { run } = require('${{ github.workspace }}/.github/scripts/readme-lists.js');
            await run({
              github,
              context,
              core,
              current: ${{ needs.gather-versions.outputs.current }},
              available: ${{ needs.gather-versions.outputs.versions }},
              metadata: ${{ needs.gather-versions.outputs.metadata }},
            });
      - name: Commit and push changes
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add README.md
          git commit -m "docs: regenerate README with latest Ruby versions"
          git push
